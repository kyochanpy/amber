[workspace]
members = [
    "crates/amber-core",
    "crates/amber-node",
    "crates/amber-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
arrow = { version = "53", features = ["ipc"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
datafusion = "43"
dora-node-api = "0.3"
image = "0.25"
object_store = "0.11"
parquet = { version = "53", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
futures = "0.3"
